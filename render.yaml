services:
  - type: web
    name: esg-report-analyzer-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.backend.fastapi_logic:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: TYPESAFE_API_KEY
        sync: false
      - key: STANDARD_DOCS_DIR
        value: data/raw/standards
      - key: STANDARD_VECTORSTORE_PATH
        value: esg_vectorstores/standards
      - key: REPORTS_VECTORSTORE_PATH
        value: esg_vectorstores/uploaded_reports
      - key: PROMPTS_FILE_PATH
        value: src/nlp/prompt_esg.yml
      - key: EMBEDDING_MODEL_NAME
        value: sentence-transformers/all-MiniLM-L6-v2
